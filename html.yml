name: Validar HTML

on:
  push:
  pull_request:

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar HTML
        run: npx --yes html-validate Tarea3A.html
      
      - name: Validar HTML
        run: npx --yes html-validate Tarea3B.html

      - name: Validar HTML
        run: npx --yes html-validate Tarea4.html

      - name: Validar HTML
        run: npx --yes html-validate Tarea5.html